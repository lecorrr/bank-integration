spring:
  application:
    name: partner-bank-sim
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:interbank}
    password: ${RABBITMQ_PASSWORD:interbank}

server:
  port: 8083

partner-bank:
  # Payments to these accounts are rejected with AC04 (account closed).
  closed-accounts:
    - UA843888880000000000000000999
  # Payments to these accounts never get an answer; status requests about them get PDNG.
  silent-accounts:
    - UA443888880000000000000000555
  # Payments this bank sends to bank-core's bank (POST /api/payments).
  sending:
    bic: PRTBUAUKXXX
    customer-iban: UA643888880000000000000000777
    customer-name: Olena Kovalenko
    payee-bank-bic: BNKCUAUKXXX
  # bank-core's bank's account here. Its statement (camt.053) goes to SFTP after each day, or on
  # POST /api/statements; the books are in memory and start again from opening-balance.
  statements:
    account-iban: UA853888880000000000000000399
    opening-balance: 1000000.00
    sftp:
      host: ${SFTP_HOST:localhost}
      port: ${SFTP_PORT:2222}
      username: ${SFTP_USER:bnkc}
      password: ${SFTP_PASSWORD:bnkc}
      directory: statements
      known-hosts-file: ${SFTP_KNOWN_HOSTS:}

camel:
  component:
    spring-rabbitmq:
      auto-declare: false   # queues are declared by InterbankTopology

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    dev.tkachuk: INFO
