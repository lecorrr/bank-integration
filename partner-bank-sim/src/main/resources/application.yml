spring:
  application:
    name: partner-bank-sim
  rabbitmq:
    # The compose RabbitMQ on localhost; in Docker, compose sets RABBITMQ_HOST=rabbitmq.
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:interbank}
    password: ${RABBITMQ_PASSWORD:interbank}

server:
  # 8080 is bank-core, 8082 integration-service.
  port: 8083

partner-bank:
  # Payments to these accounts are refused with a pacs.002 RJCT, reason AC04 (the account is closed), and
  # bank-core gives the money back. Every other payment is accepted.
  closed-accounts:
    - UA843888880000000000000000999

camel:
  component:
    spring-rabbitmq:
      # The exchange, queues and bindings come from InterbankTopology, declared once by Spring's RabbitAdmin.
      auto-declare: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    dev.tkachuk: INFO
