spring:
  application:
    name: integration-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/integration}
    username: ${DB_USER:integration}
    password: ${DB_PASSWORD:integration}
    hikari:
      connection-timeout: 5000   # ms; without a database a step fails fast and the route retries it
      data-source-properties:
        socketTimeout: 30   # seconds; the driver's default is to wait forever
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:interbank}
    password: ${RABBITMQ_PASSWORD:interbank}
    publisher-confirm-type: simple   # needed by confirm=enabled in Routes.toQueue
    connection-timeout: 5s

server:
  port: 8082

camel:
  component:
    spring-rabbitmq:
      # Queues are declared by InterbankTopology (quorum queues). A queue Camel declared itself would
      # lack the quorum argument and the broker would refuse it.
      auto-declare: false
    kafka:
      brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Our bank and the SEP participants we can pay, by the bank code in their IBANs.
interbank:
  bank-code: "399999"
  bic: BNKCUAUKXXX
  participants:
    "388888": PRTBUAUKXXX

# pacs.028 status requests for payments without a final answer. They never stop.
status-requests:
  first-after: 30s
  max-interval: 10m   # the wait doubles after each request up to this
  alarm-after: 5   # from the 5th request on, each one is logged as an error
  poll-interval: 5s

sanctions-screening:
  url: ${SANCTIONS_SCREENING_URL:http://localhost:8084/ws/screening}
  connect-timeout: 2s
  read-timeout: 5s
  # Opens when half of the last 10 calls failed (counted from the 5th call), stays open 30 s,
  # then 2 trial calls decide whether it closes.
  circuit-breaker:
    failure-rate-threshold: 50
    sliding-window-size: 10
    minimum-number-of-calls: 5
    wait-in-open-state: 30s
    permitted-calls-in-half-open-state: 2

# The partner bank's daily statement (camt.053) of our account there, from the partner bank's SFTP server.
reconciliation:
  account-iban: UA853888880000000000000000399
  poll-interval: 1m
  sftp:
    host: ${SFTP_HOST:localhost}
    port: ${SFTP_PORT:2222}
    username: ${SFTP_USER:bnkc}
    password: ${SFTP_PASSWORD:bnkc}
    directory: statements
    # Without it the server's host key is not checked, which is only fine for the local demo.
    known-hosts-file: ${SFTP_KNOWN_HOSTS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    dev.tkachuk: INFO
