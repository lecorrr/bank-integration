# Local stack for bank-integration. Every port is published on localhost only.
name: bank-integration

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5435:5432"   # 5432-5434 are taken by other databases, bank-core's included
    volumes:
      - integration-db:/var/lib/postgresql/data
      # Runs once on an empty volume: creates the bank-core and integration databases.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:4.3-management-alpine   # same tag as rabbitmq.image in pom.xml
    hostname: rabbitmq   # RabbitMQ keeps its data per node name, which comes from the hostname
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"   # management UI, interbank / interbank
    volumes:
      - ./docker/rabbitmq/20-interbank.conf:/etc/rabbitmq/conf.d/20-interbank.conf:ro
      - rabbitmq-data:/var/lib/rabbitmq
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 24

  kafka:
    image: apache/kafka-native:4.4.0
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    # Single node, broker and controller. The host connects to localhost:9092, containers to kafka:19092.
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: YmFuay1pbnRlZ3JhdGlvbg   # "bank-integration" in base64
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      # No volume: "docker compose down" empties Kafka, which is fine for a demo.
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      # With one broker there is no replica, so write every message to disk before acknowledging it.
      KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: 1
    mem_limit: 512m

  sftp:
    image: atmoz/sftp:alpine
    ports:
      - "127.0.0.1:2222:22"
    # user:password:uid:gid:folder; camt.053 statements go here (step 7)
    command: partner:partner:1001:1001:statements
    mem_limit: 64m

  # Stand-in for the sanctions screening service: WireMock with the test stubs.
  # The one listed name is "Sanctioned Test Entity".
  sanctions-screening:
    image: wiremock/wiremock:3.13.2
    # Outside /home/wiremock, which the image's entrypoint may try to chown.
    command: ["--root-dir", "/stubs", "--disable-banner"]
    volumes:
      - ./integration-service/src/test/resources/sanctions-screening:/stubs:ro
    ports:
      - "127.0.0.1:8084:8080"
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=50"
    mem_limit: 384m

  integration-service:
    build: ./integration-service
    image: integration-service:local
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_started
      sanctions-screening:   # not required to be up: payments wait until screening answers
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/integration
      RABBITMQ_HOST: rabbitmq
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SANCTIONS_SCREENING_URL: http://sanctions-screening:8080/ws/screening
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs   # JSON logs for ELK (Project 3)
    ports:
      - "127.0.0.1:8082:8082"
    # Camel finishes the messages in hand on shutdown. A kill loses nothing either: the unfinished payment is
    # sent again after the restart and the partner bank repeats its answer.
    stop_grace_period: 30s
    mem_limit: 768m

  partner-bank-sim:
    build: ./partner-bank-sim
    image: partner-bank-sim:local
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    ports:
      - "127.0.0.1:8083:8083"
    mem_limit: 640m

volumes:
  integration-db:
  rabbitmq-data:
